[project]
name = "nomad_camels"
version = "1.11.0"
description = "CAMELS is a configurable measurement software, targeted towards the requirements of experimental solid-state physics."
authors = [
    {name = "FAIRmat - HU Berlin", email = "nomad-camels@fau.de"}
]
readme = "README.md"
# Python 3.13 and 3.14 support is being validated on the migration branch.
requires-python = ">=3.9,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
]

# PEP 621 dependencies are recognized by uv, pip and poetry-core.
dependencies = [
    # Core application dependencies
    "pyside6>=6.6.0,<6.9; python_version < '3.13'",
    "pyside6>=6.10.1,<6.13; python_version >= '3.13'",
    "bluesky>=1.9.0",
    "ophyd>=1.6.4",
    "lmfit>=1.3.0",
    "suitcase-nomad-camels-hdf5>=1.3.2",
    "databroker>=1.2.5,<2.0.0",
    "matplotlib>=3.6.2",
    "pyqtgraph>=0.13.3",
    "requests>=2.26.0",

    # Preserve the existing Python-specific minimums where possible.
    "pyyaml>=5.3.1; python_version < '3.10'",
    "pyyaml>=6.0; python_version >= '3.10' and python_version < '3.12'",
    "pyyaml>=6.0.1; python_version >= '3.12'",
    "pyzmq>=22.1.0; python_version < '3.10'",
    "pyzmq>=26.2.0; python_version >= '3.10'",
    "setuptools>=36.0.1; python_version < '3.10'",
    "setuptools>=54.2.0; python_version >= '3.10' and python_version < '3.12'",
    "setuptools>=66.1.0; python_version >= '3.12'",
    "numpy>=1.22.0,<2.1.0; python_version < '3.10'",
    "numpy>=1.23.0; python_version >= '3.10' and python_version < '3.12'",
    "numpy>=1.26.0; python_version == '3.12'",
    "numpy>=2.1.0; python_version == '3.13'",
    "numpy>=2.4.0; python_version >= '3.14'",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.1",
    "httpx>=0.21.0; python_version < '3.10'",
    "httpx>=0.28.1; python_version >= '3.10'",
    "uvicorn>=0.19.0,<0.22.0; python_version < '3.12'",
    "uvicorn>=0.22.0; python_version >= '3.12'",
]
material = ["qt-material>=2.12"]
visa = [
    "pyvisa>=1.12.0",
    "pyvisa-py>=0.5.3",
    "pyusb>=1.2.0",
    "pyserial>=3.0",
    "psutil>=6.0.0",
    "zeroconf>=0.70.0",
]
dash = ["dash>=2.7.0"]

# Retain the published "dev" extra for existing installation/CI workflows.
# uv development environments use the equivalent [dependency-groups].dev below.
dev = [
    "pytest>=7.0.0; python_version < '3.10'",
    "pytest>=7.3.2; python_version >= '3.10'",
    "pytest-qt>=4.2.0",
    "pytest-order>=0.7.1",
    "pytest-mock>=0.4.0",
    "pytest-timeout>=1.3.1",
    "pytest-cov>=6.0.0",
    "pytest-xvfb>=3.0.0; sys_platform == 'linux'",
]

[dependency-groups]
# Keep these aligned with the published dev extra while transitioning CI to uv.
dev = [
    "pytest>=7.0.0; python_version < '3.10'",
    "pytest>=7.3.2; python_version >= '3.10'",
    "pytest-qt>=4.2.0",
    "pytest-order>=0.7.1",
    "pytest-mock>=0.4.0",
    "pytest-timeout>=1.3.1",
    "pytest-cov>=6.0.0",
    "pytest-xvfb>=3.0.0; sys_platform == 'linux'",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
"GitHub Page" = "https://github.com/FAU-LAP/NOMAD-CAMELS"
"Documentation" = "https://fau-lap.github.io/NOMAD-CAMELS/"

[project.gui-scripts]
nomad-camels = "nomad_camels:start_camels"
