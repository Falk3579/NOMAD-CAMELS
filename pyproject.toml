[project]
name = "nomad_camels"
version = "1.11.0"
description = "CAMELS is a configurable measurement software, targeted towards the requirements of experimental solid-state physics."
authors = [{name = "FAIRmat - HU Berlin", email = "nomad-camels@fau.de"}]
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
]

# Only Python 3.14+ is supported. No legacy Python-version markers.
dependencies = [
    "pyside6>=6.10.1,<6.13",
    "bluesky>=1.9.0",
    "ophyd>=1.6.4",
    "lmfit>=1.3.0",
    "suitcase-nomad-camels-hdf5>=1.3.2",
    "databroker>=1.2.5,<2.0.0",
    "matplotlib>=3.6.2",
    "pyqtgraph>=0.13.3",
    "requests>=2.26.0",
    "pyyaml>=6.0.1",
    "pyzmq>=26.2.0",
    "setuptools>=66.1.0",
    "numpy>=2.4.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110.1", "httpx>=0.28.1", "uvicorn>=0.22.0"]
material = ["qt-material>=2.12"]
visa = [
    "pyvisa>=1.12.0",
    "pyvisa-py>=0.5.3",
    "pyusb>=1.2.0",
    "pyserial>=3.0",
    "psutil>=6.0.0",
    "zeroconf>=0.70.0",
]
dash = ["dash>=2.7.0"]

# Maintain the published dev extra for pip users.
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.2.0",
    "pytest-order>=0.7.1",
    "pytest-mock>=0.4.0",
    "pytest-timeout>=1.3.1",
    "pytest-cov>=6.0.0",
    "pytest-xvfb>=3.0.0; sys_platform == 'linux'",
    "ruff==0.17.4",
    "pyrefly==1.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.2.0",
    "pytest-order>=0.7.1",
    "pytest-mock>=0.4.0",
    "pytest-timeout>=1.3.1",
    "pytest-cov>=6.0.0",
    "pytest-xvfb>=3.0.0; sys_platform == 'linux'",
    "ruff==0.17.4",
    "pyrefly==1.4.1",
]

[build-system]
requires = ["hatchling>=1.32.3,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include Qt .ui/.qrc files, graphics, generated resource modules, and Python code.
packages = ["nomad_camels"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Preserve the existing CI lint baseline; extend as legacy findings are addressed.
select = ["E9", "F63", "F7", "F82"]

[tool.pyrefly]
python-version = "3.14"
preset = "basic"
# Incremental rollout: expand this enforced scope as existing modules gain annotations.
project-includes = [
    "nomad_camels/utility/dict_recursive_string.py",
    "nomad_camels/utility/fit_variable_renaming.py",
    "nomad_camels/utility/tqdm_progress_bar.py",
]

[project.urls]
"GitHub Page" = "https://github.com/FAU-LAP/NOMAD-CAMELS"
"Documentation" = "https://fau-lap.github.io/NOMAD-CAMELS/"

[project.gui-scripts]
nomad-camels = "nomad_camels:start_camels"
