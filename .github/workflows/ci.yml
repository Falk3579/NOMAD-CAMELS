name: Run Python Tests

on:
  push:
    branches:
      - development
      - main
      - testing
      - compat/python314-uv
  pull_request:
    branches:
      - development
      - main
      - testing

jobs:
  windows_test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Python 3
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
      - name: Install dependencies
        run: |
          uv sync --python 3.14 --all-extras --group dev
      - name: List packages
        run: uv pip list
      - name: Lint with Ruff
        run: uv run --no-sync ruff check --output-format=github .
      - name: Type check with Pyrefly
        run: uv run --no-sync pyrefly check
      - name: Run tests with pytest
        run: uv run --no-sync python -m pytest -p no:dash -p no:zarr -vv --timeout=100 --cov-config=./nomad_camels/tests/.coveragerc --cov-report=term-missing:skip-covered --cov=nomad_camels
      - name: Rename coverage file (Windows)
        run: |
          ren .coverage .coverage.windows
      - name: Upload coverage artifact (Windows)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-windows
          path: .coverage.windows
          include-hidden-files: true

  ubuntu_test:
    runs-on: ubuntu-latest
    env:
      DISPLAY: ':99.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Python 3
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: tlambert03/setup-qt-libs@v1.8
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libopengl0 libpulse0
          uv sync --python 3.14 --all-extras --group dev
      - name: List packages
        run: uv pip list
      - name: Lint with Ruff
        run: uv run --no-sync ruff check --output-format=github .
      - name: Type check with Pyrefly
        run: uv run --no-sync pyrefly check
      - name: Run tests with pytest
        run: |
          uv run --no-sync python -m pytest -p no:dash -p no:zarr -vv --timeout=100 --cov-config=./nomad_camels/tests/.coveragerc --cov-report=term-missing:skip-covered --cov=nomad_camels
      - name: Build wheel and source distribution with Hatchling
        run: uv build
      - name: Verify packaged Qt and graphics assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          expected = {
              "nomad_camels/gui/mainWindow_v2.ui",
              "nomad_camels/gui/settings_window_resource_rc.py",
              "nomad_camels/graphics/dark.qss",
          }
          with ZipFile(wheel) as archive:
              missing = expected - set(archive.namelist())
          assert not missing, f"Missing wheel assets: {sorted(missing)}"
          PY
      - name: Rename coverage file (Ubuntu)
        run:  |
          mv .coverage .coverage.ubuntu
      - name: Upload coverage artifact (Ubuntu)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-ubuntu
          path: .coverage.ubuntu
          include-hidden-files: true

  macos_test:
    runs-on: macos-latest
    env:
      # tell Qt to use the offscreen plugin
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Python 3
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
      - name: Install dependencies
        run: |
          if brew list pkg-config@0.29.2 &>/dev/null; then
            brew unlink pkg-config@0.29.2
          fi
          brew install hdf5
          echo "HDF5_DIR=$(brew --prefix hdf5)" >> $GITHUB_ENV
          uv sync --python 3.14 --all-extras --group dev
      - name: List packages
        run: uv pip list
      - name: Lint with Ruff
        run: uv run --no-sync ruff check --output-format=github .
      - name: Type check with Pyrefly
        run: uv run --no-sync pyrefly check
      - name: Run tests with pytest
        run: |
          uv run --no-sync python -m pytest -p no:dash -p no:zarr -vv --timeout=100 --cov-config=./nomad_camels/tests/.coveragerc --cov-report=term-missing:skip-covered --cov=nomad_camels
      - name: Rename coverage file (macOS)
        run: |
          mv .coverage .coverage.macos
      - name: Upload coverage artifact (macOS)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-macos
          path: .coverage.macos
          include-hidden-files: true


  # Verify distribution artifacts independently of the editable/source environment.
  # Python 3.14 must install the wheel and initialize its Qt GUI on all platforms.
  wheel_smoke_test:
    name: Installed wheel smoke test (Python 3.14, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Python 3.14
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
      - name: Install Qt libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libopengl0 libpulse0
      - name: Build wheel with Hatchling
        run: uv build --wheel
      - name: Install wheel in a clean environment and smoke-test GUI
        run: python dev_tools/smoke_installed_wheel.py

  # Experimental Python 3.15 across all platforms. Failures must never block
  # Python 3.14 CI or the aggregate coverage report.
  python315_experimental:
    name: Python 3.15 (informational) - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python 3.15
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libopengl0 libpulse0
      - name: Install macOS HDF5
        if: runner.os == 'macOS'
        run: |
          brew install hdf5
          echo "HDF5_DIR=$(brew --prefix hdf5)" >> "$GITHUB_ENV"
      - name: Install dependencies for Python 3.15
        id: dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Native HDF5 is available above, so the PyPI source build works.
            uv sync --python 3.15 --all-extras --group dev
          else
            # h5py 3.16 has no cp315 wheels on PyPI yet. Keep the normal
            # dependency resolution but skip its source build, then install
            # the h5py project's cp315 nightly wheel for experimental CI only.
            uv sync --python 3.15 --all-extras --group dev --no-install-package h5py
            uv pip install --no-deps \
              --index https://pypi.anaconda.org/scientific-python-nightly-wheels/simple \
              "h5py==3.17.0.dev0"
          fi
          # Fail immediately if the installed extension cannot load HDF5.
          uv run --no-sync python -c "import h5py; print('h5py', h5py.__version__, 'HDF5', h5py.version.hdf5_version)"
      - name: Run Python 3.15 tests
        id: tests
        run: uv run --no-sync python -m pytest -p no:dash -p no:zarr -vv --timeout=100 nomad_camels/tests
      - name: Summarize informational test result
        if: always()
        shell: bash
        run: |
          {
            echo "## Python 3.15 on ${RUNNER_OS} (informational)"
            echo "- Dependency installation: ${{ steps.dependencies.outcome }}"
            echo "- Test suite: ${{ steps.tests.outcome }}"
            echo "- This job is non-blocking; Python 3.14 remains required."
          } >> "$GITHUB_STEP_SUMMARY"

  coverage_report:
    runs-on: ubuntu-latest
    needs: [windows_test, ubuntu_test, macos_test]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download Windows coverage artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-windows
          path: coverage_files
      - name: Download Ubuntu coverage artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-ubuntu
          path: coverage_files
      - name: Download macOS coverage artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-macos
          path: coverage_files
      - name: Install Python and coverage
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Install coverage
        run: pip install coverage
      - name: Combine coverage files and display report
        run: |
          shopt -s dotglob && cp coverage_files/* .
          coverage combine
          coverage report --include="nomad_camels/*" --omit=*/site-packages/* --show-missing
      - name: Generate HTML Coverage Report
        run: |
          coverage html --include="nomad_camels/*" --omit=*/site-packages/*
      - name: Upload HTML Coverage Report Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: html-coverage-report
          path: htmlcov
          include-hidden-files: true
