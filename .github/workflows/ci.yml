name: Run Python Tests

on:
  push:
    branches:
      - development
      - main
      - testing
      - compat/python314-uv
  pull_request:
    branches:
      - development
      - main
      - testing

jobs:
  windows_test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          uv sync --python 3.14 --all-extras --group dev
      - name: List packages
        run: uv pip list
      - name: Lint with Ruff
        run: uv run --no-sync ruff check --output-format=github .
      - name: Type check with Pyrefly
        run: uv run --no-sync pyrefly check
      - name: Run tests with pytest
        run: uv run --no-sync python -m pytest -p no:dash -p no:zarr -vv --timeout=100 --cov-config=./nomad_camels/tests/.coveragerc --cov-report=term-missing:skip-covered --cov=nomad_camels
      - name: Rename coverage file (Windows)
        run: |
          ren .coverage .coverage.windows
      - name: Upload coverage artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: .coverage.windows
          include-hidden-files: true

  ubuntu_test:
    runs-on: ubuntu-latest
    env:
      DISPLAY: ':99.0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: tlambert03/setup-qt-libs@v1
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libopengl0 libpulse0
          uv sync --python 3.14 --all-extras --group dev
      - name: List packages
        run: uv pip list
      - name: Lint with Ruff
        run: uv run --no-sync ruff check --output-format=github .
      - name: Type check with Pyrefly
        run: uv run --no-sync pyrefly check
      - name: Run tests with pytest
        run: |
          uv run --no-sync python -m pytest -p no:dash -p no:zarr -vv --timeout=100 --cov-config=./nomad_camels/tests/.coveragerc --cov-report=term-missing:skip-covered --cov=nomad_camels
      - name: Build wheel and source distribution with Hatchling
        run: uv build
      - name: Verify packaged Qt and graphics assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          expected = {
              "nomad_camels/gui/mainWindow_v2.ui",
              "nomad_camels/gui/settings_window_resource_rc.py",
              "nomad_camels/graphics/dark.qss",
          }
          with ZipFile(wheel) as archive:
              missing = expected - set(archive.namelist())
          assert not missing, f"Missing wheel assets: {sorted(missing)}"
          PY
      - name: Rename coverage file (Ubuntu)
        run:  |
          mv .coverage .coverage.ubuntu
      - name: Upload coverage artifact (Ubuntu)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: .coverage.ubuntu
          include-hidden-files: true

  macos_test:
    runs-on: macos-latest
    env:
      # tell Qt to use the offscreen plugin
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          if brew list pkg-config@0.29.2 &>/dev/null; then
            brew unlink pkg-config@0.29.2
          fi
          brew install hdf5
          echo "HDF5_DIR=$(brew --prefix hdf5)" >> $GITHUB_ENV
          uv sync --python 3.14 --all-extras --group dev
      - name: List packages
        run: uv pip list
      - name: Lint with Ruff
        run: uv run --no-sync ruff check --output-format=github .
      - name: Type check with Pyrefly
        run: uv run --no-sync pyrefly check
      - name: Run tests with pytest
        run: |
          uv run --no-sync python -m pytest -p no:dash -p no:zarr -vv --timeout=100 --cov-config=./nomad_camels/tests/.coveragerc --cov-report=term-missing:skip-covered --cov=nomad_camels
      - name: Rename coverage file (macOS)
        run: |
          mv .coverage .coverage.macos
      - name: Upload coverage artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macos
          path: .coverage.macos
          include-hidden-files: true

  coverage_report:
    runs-on: ubuntu-latest
    needs: [windows_test, ubuntu_test, macos_test]
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-windows
          path: coverage_files
      - name: Download Ubuntu coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-ubuntu
          path: coverage_files
      - name: Download macOS coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-macos
          path: coverage_files
      - name: Install Python and coverage
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install coverage
        run: pip install coverage
      - name: Combine coverage files and display report
        run: |
          shopt -s dotglob && cp coverage_files/* .
          coverage combine
          coverage report --include="nomad_camels/*" --omit=*/site-packages/* --show-missing
      - name: Generate HTML Coverage Report
        run: |
          coverage html --include="nomad_camels/*" --omit=*/site-packages/*
      - name: Upload HTML Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov
          include-hidden-files: true
