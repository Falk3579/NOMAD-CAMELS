# Read-only reference: this does NOT restore Python 3.11 product support.
name: Python 3.11 historical regression baseline

on:
  push:
    branches:
      - feature/python-3-14-support
    paths:
      - .github/workflows/python311-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: "offscreen"
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Check out pre-migration commit (read-only)
        uses: actions/checkout@v4
        with:
          ref: f07bb422d30d4da689ab396ed023a8ec2e5d3027
          persist-credentials: false

      - name: Install the historical Python 3.11 interpreter
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries on Ubuntu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libpulse0

      - name: Capture reference revision and platform
        run: |
          mkdir -p diagnostics
          git rev-parse HEAD | tee diagnostics/source-sha.txt
          python -c "import sys,platform; print(sys.version); print(platform.platform())" | tee diagnostics/platform.txt

      - name: Install historical dependencies and test tooling
        id: baseline_install
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<2" "pims>=0.7"
          python -m pip install -e ".[dev]" 2>&1 | tee diagnostics/install.txt

      - name: Check dependencies and main import
        id: baseline_check
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip check 2>&1 | tee diagnostics/pip-check.txt
          python -c "import nomad_camels; print('Historical import passed')" 2>&1 | tee diagnostics/import.txt

      - name: Existing Qt loading-screen tests
        id: focused
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 180s python -m pytest -q \
            nomad_camels/tests/startup_test.py::test_set_progress \
            nomad_camels/tests/startup_test.py::test_set_text \
            --timeout=45 2>&1 | tee diagnostics/focused-tests.txt

      - name: Original test suite (record first failure, no hardware guarantee)
        id: full_tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 240s python -m pytest -q nomad_camels/tests \
            --timeout=45 --maxfail=1 2>&1 | tee diagnostics/full-suite.txt

      - name: Capture reference dependency versions
        if: always()
        run: python -m pip freeze > diagnostics/pip-freeze.txt

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-python311-comparison
          path: diagnostics/
          if-no-files-found: warn

      - name: Summarize historical results
        if: always()
        env:
          INSTALL: ${{ steps.baseline_install.outcome }}
          DEPS: ${{ steps.baseline_check.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full_tests.outcome }}
        run: |
          echo "### Python 3.11 historical comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned pre-migration SHA: f07bb422d30d4da689ab396ed023a8ec2e5d3027" >> "$GITHUB_STEP_SUMMARY"
          echo "Installation: $INSTALL" >> "$GITHUB_STEP_SUMMARY"
          echo "pip check and import: $DEPS" >> "$GITHUB_STEP_SUMMARY"
          echo "Focused historical tests: $FOCUSED" >> "$GITHUB_STEP_SUMMARY"
          echo "Full original suite: $FULL" >> "$GITHUB_STEP_SUMMARY"
          echo "Results do not change the Python 3.14-only support policy." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$INSTALL" != success || "$DEPS" != success || "$FOCUSED" != success ]]; then
            echo "::warning::Historical comparison did not fully pass; inspect artifacts."
          fi
