[tox]
env_list = py314
requires = tox>=4

[testenv:py314]
base_python = python3.14
package = wheel
extras = api, material, visa, dash, dev
setenv =
    PYTHONIOENCODING = utf-8
passenv =
    LOCALAPPDATA
    COMPUTERNAME
commands =
    pytest -p no:dash -p no:zarr -vv --timeout=100 nomad_camels/tests
